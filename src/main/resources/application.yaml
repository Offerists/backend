app:
  timezone: ${APP_TIMEZONE:Europe/Moscow}

spring:
  application:
    name: AIProjectManager

  datasource:
    url: jdbc:postgresql://${DB_CONTAINER_NAME}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: meta-llama/llama-4-scout-17b-16e-instruct

yougile:
  base-url: https://yougile.com/api-v2

groq:
  api-key: ${GROQ_API_KEY}
  base-url: https://api.groq.com/openai/v1
  whisper-model: ${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
